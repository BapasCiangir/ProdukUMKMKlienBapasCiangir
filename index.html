<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produk UMKM Klien Bapas Ciangir</title>
<style>
:root{--g:#1f5f3b;--g2:#e8f3ec;--b:#1a3c6e;--t:#1d2521;--m:#66706a;--bg:#f6f8f6;--c:#fff;--bd:#dfe5e1}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,var(--g),var(--b));color:#fff;padding:36px 20px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(22px,4vw,34px)}header p{margin:0;opacity:.9}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select,textarea,button{font:inherit}
input,select,textarea{padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;width:100%}
.bar input{flex:2;min-width:200px}.bar select{flex:1;min-width:140px}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--g);color:#fff;font-weight:600}
button.sec{background:var(--g2);color:var(--g)}button.red{background:#b3261e}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.img{height:170px;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:54px}
.img img{width:100%;height:100%;object-fit:cover}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{font-size:12px;background:var(--g2);color:var(--g);padding:2px 8px;border-radius:99px;align-self:flex-start}
.card h3{margin:0;font-size:17px}.price{font-weight:700;color:var(--g);font-size:18px}
.sm{font-size:13px;color:var(--m)}.card .body button{margin-top:auto}
.msg{text-align:center;color:var(--m);padding:40px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal.on{display:flex}.box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.box.wide{max-width:860px}.box h2{margin-top:0}label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}.acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:#eee;color:var(--t)}.tabs button.on{background:var(--g);color:#fff}
.scroll{overflow-x:auto}footer{text-align:center;color:var(--m);font-size:13px;padding:24px}
footer a{color:var(--b);cursor:pointer}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:99}
</style>
</head>
<body>
<header>
  <h1>Produk UMKM Klien Bapas Ciangir</h1>
  <p>Hasil karya klien pemasyarakatan yang mandiri, produktif, dan berdaya</p>
</header>

<div class="wrap">
  <div class="bar">
    <input id="q" placeholder="Cari produk atau pelaku UMKM...">
    <select id="kat"><option value="">Semua Kategori</option></select>
  </div>
  <div id="list" class="grid"></div>
  <div id="empty" class="msg">Memuat produk...</div>
</div>
<footer>© Bapas Ciangir · Program Pembimbingan Kemandirian · <a onclick="openAdmin()">Admin</a></footer>

<!-- Modal pesan -->
<div class="modal" id="mOrder"><div class="box">
  <h2>Pesan Produk</h2>
  <div id="oInfo" class="sm"></div>
  <label>Jumlah</label><input type="number" id="oQty" min="1" value="1">
  <label>Nama Anda *</label><input id="oNama">
  <label>No. WhatsApp *</label><input id="oWa" placeholder="08xxxxxxxxxx" inputmode="tel">
  <label>Alamat</label><textarea id="oAlamat" rows="2"></textarea>
  <label>Catatan</label><input id="oCat">
  <div class="price" id="oTotal" style="margin-top:12px"></div>
  <div class="acts"><button class="sec" onclick="closeM('mOrder')">Batal</button><button id="oBtn" onclick="kirimPesan()">Kirim Pesanan</button></div>
</div></div>

<!-- Modal admin -->
<div class="modal" id="mAdmin"><div class="box wide">
  <div id="aLogin">
    <h2>Login Admin</h2><label>PIN</label><input type="password" id="aPin">
    <div class="acts"><button class="sec" onclick="closeM('mAdmin')">Tutup</button><button onclick="login()">Masuk</button></div>
  </div>
  <div id="aPanel" style="display:none">
    <div class="tabs"><button id="t1" class="on" onclick="tab(1)">Tambah Produk</button><button id="t2" onclick="tab(2)">Kelola Produk</button><button id="t3" onclick="tab(3)">Pesanan</button><button class="sec" style="margin-left:auto" onclick="closeM('mAdmin')">Tutup</button></div>
    <div id="p1">
      <div class="row"><div><label>Nama Produk *</label><input id="fNama"></div><div><label>Kategori</label>
        <select id="fKat"><option>Makanan</option><option>Minuman</option><option>Kerajinan</option><option>Pertanian</option><option>Jasa</option><option>Lainnya</option></select></div></div>
      <div class="row"><div><label>Harga (Rp) *</label><input type="number" id="fHarga" min="0"></div><div><label>Stok</label><input type="number" id="fStok" min="0" value="10"></div></div>
      <label>Deskripsi</label><textarea id="fDesk" rows="2"></textarea>
      <div class="row"><div><label>Nama Pelaku UMKM</label><input id="fPelaku"></div><div><label>WhatsApp Penjual</label><input id="fWa" placeholder="628xxxxxxxxxx"></div></div>
      <label>URL Foto (link Google Drive / gambar)</label><input id="fFoto">
      <div class="acts"><button onclick="tambah()">Simpan ke Spreadsheet</button></div>
    </div>
    <div id="p2" style="display:none" class="scroll"></div>
    <div id="p3" style="display:none" class="scroll"></div>
  </div>
</div></div>
<div id="toast"></div>

<script>
/* ====== PENGATURAN: tempel URL Web App Apps Script di sini ====== */
const API_URL = 'GANTI_DENGAN_URL_WEB_APP_ANDA';
/* ================================================================ */

let PRODUK = [], PIN = '', cur = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const EMO = {Makanan:'🍪', Minuman:'🥤', Kerajinan:'🧺', Pertanian:'🌱', Jasa:'🛠️', Lainnya:'📦'};

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function closeM(id){$(id).classList.remove('on')}
function fotoUrl(u){
  u = String(u || '').trim(); if(!u) return '';
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w600';
  return /^https?:\/\//.test(u) ? u : '';
}
async function get(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams(params)); return r.json();
}
async function post(action, data, pin){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, data, pin})});
  return r.json();
}

/* ---------- Katalog ---------- */
async function load(){
  try{
    const r = await get({action:'produk'});
    if(!r.ok) throw new Error(r.error);
    PRODUK = r.data;
    const kats = [...new Set(PRODUK.map(p => p['Kategori']).filter(Boolean))];
    $('kat').innerHTML = '<option value="">Semua Kategori</option>' + kats.map(k => `<option>${esc(k)}</option>`).join('');
    render();
  }catch(e){ $('empty').textContent = 'Gagal memuat data. Pastikan API_URL sudah diisi dengan benar.'; }
}
function render(){
  const q = $('q').value.toLowerCase(), k = $('kat').value;
  const f = PRODUK.filter(p => (!k || p['Kategori'] === k) &&
    (p['Nama Produk'] + ' ' + p['Pelaku UMKM']).toLowerCase().includes(q));
  $('empty').style.display = f.length ? 'none' : 'block';
  if(!f.length) $('empty').textContent = 'Belum ada produk yang cocok.';
  $('list').innerHTML = f.map(p => {
    const img = fotoUrl(p['URL Foto']);
    const habis = Number(p['Stok']) <= 0;
    return `<div class="card"><div class="img">${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.replaceWith('${EMO[p['Kategori']]||'📦'}')">` : (EMO[p['Kategori']]||'📦')}</div>
    <div class="body"><span class="tag">${esc(p['Kategori'])}</span><h3>${esc(p['Nama Produk'])}</h3>
    <div class="price">${rp(p['Harga (Rp)'])}</div><div class="sm">${esc(p['Deskripsi'])}</div>
    <div class="sm">Oleh: ${esc(p['Pelaku UMKM'])} · Stok: ${esc(p['Stok'])}</div>
    <button ${habis?'disabled':''} onclick="buka('${esc(p['ID'])}')">${habis?'Stok Habis':'Pesan'}</button></div></div>`;
  }).join('');
}
$('q').oninput = render; $('kat').onchange = render;

/* ---------- Pesan ---------- */
function buka(id){
  cur = PRODUK.find(p => p['ID'] === id); if(!cur) return;
  $('oInfo').innerHTML = `<b>${esc(cur['Nama Produk'])}</b> · ${rp(cur['Harga (Rp)'])} · stok ${esc(cur['Stok'])}`;
  $('oQty').value = 1; $('oQty').max = cur['Stok']; hitung(); $('mOrder').classList.add('on');
}
function hitung(){ $('oTotal').textContent = 'Total: ' + rp((Number($('oQty').value)||0) * Number(cur['Harga (Rp)'])); }
$('oQty').oninput = hitung;
async function kirimPesan(){
  const btn = $('oBtn'); btn.disabled = true; btn.textContent = 'Mengirim...';
  try{
    const r = await post('pesan', {idProduk: cur['ID'], jumlah: $('oQty').value, nama: $('oNama').value,
      wa: $('oWa').value, alamat: $('oAlamat').value, catatan: $('oCat').value});
    if(!r.ok) throw new Error(r.error);
    closeM('mOrder'); toast('Pesanan ' + r.id + ' berhasil dikirim');
    if(r.wa && confirm('Pesanan tersimpan. Hubungi penjual via WhatsApp untuk konfirmasi?')){
      const t = `Halo, saya ${$('oNama').value} memesan ${$('oQty').value}x ${r.produk} (Total ${rp(r.total)}). No. pesanan: ${r.id}`;
      window.open('https://wa.me/' + r.wa + '?text=' + encodeURIComponent(t), '_blank');
    }
    load();
  }catch(e){ alert(e.message || 'Gagal mengirim pesanan'); }
  btn.disabled = false; btn.textContent = 'Kirim Pesanan';
}

/* ---------- Admin ---------- */
function openAdmin(){ $('mAdmin').classList.add('on'); }
async function login(){
  const r = await post('login', {}, $('aPin').value);
  if(!r.ok) return alert(r.error || 'PIN salah');
  PIN = $('aPin').value; $('aLogin').style.display = 'none'; $('aPanel').style.display = 'block'; tab(1);
}
function tab(n){
  [1,2,3].forEach(i => { $('p'+i).style.display = i===n ? '' : 'none'; $('t'+i).classList.toggle('on', i===n); });
  if(n===2) adminProduk(); if(n===3) adminPesanan();
}
async function tambah(){
  if(!$('fNama').value.trim() || !$('fHarga').value) return alert('Nama dan harga wajib diisi');
  const r = await post('tambah_produk', {nama:$('fNama').value, kategori:$('fKat').value, harga:$('fHarga').value,
    stok:$('fStok').value, deskripsi:$('fDesk').value, pelaku:$('fPelaku').value, wa:$('fWa').value, foto:$('fFoto').value}, PIN);
  if(!r.ok) return alert(r.error);
  toast('Tersimpan: ' + r.id); ['fNama','fHarga','fDesk','fPelaku','fWa','fFoto'].forEach(i => $(i).value = ''); load();
}
async function adminProduk(){
  $('p2').textContent = 'Memuat...';
  const r = await get({action:'admin_produk', pin:PIN}); if(!r.ok) return $('p2').textContent = r.error;
  $('p2').innerHTML = '<table><tr><th>ID</th><th>Produk</th><th>Harga</th><th>Stok</th><th>Status</th><th></th></tr>' +
    r.data.map(p => `<tr><td>${esc(p['ID'])}</td><td>${esc(p['Nama Produk'])}</td><td>${rp(p['Harga (Rp)'])}</td>
    <td><input type="number" value="${esc(p['Stok'])}" style="width:70px" onchange="ubah('ubah_stok',{id:'${esc(p['ID'])}',stok:this.value})"></td>
    <td><button class="sec" onclick="ubah('ubah_status_produk',{id:'${esc(p['ID'])}',status:'${p['Status']==='Aktif'?'Nonaktif':'Aktif'}'},adminProduk)">${esc(p['Status'])}</button></td>
    <td><button class="red" onclick="hapus('${esc(p['ID'])}')">Hapus</button></td></tr>`).join('') + '</table>';
}
async function ubah(a, d, cb){
  const r = await post(a, d, PIN); if(!r.ok) return alert(r.error); toast('Tersimpan'); if(cb) cb(); load();
}
async function hapus(id){ if(confirm('Hapus produk ' + id + '?')) ubah('hapus_produk', {id}, adminProduk); }
async function adminPesanan(){
  $('p3').textContent = 'Memuat...';
  const r = await get({action:'admin_pesanan', pin:PIN}); if(!r.ok) return $('p3').textContent = r.error;
  if(!r.data.length) return $('p3').textContent = 'Belum ada pesanan.';
  $('p3').innerHTML = '<table><tr><th>ID</th><th>Waktu</th><th>Produk</th><th>Pemesan</th><th>Total</th><th>Status</th></tr>' +
    r.data.map(o => `<tr><td>${esc(o['ID Pesanan'])}</td><td>${esc(o['Waktu'])}</td><td>${esc(o['Nama Produk'])} ×${esc(o['Jumlah'])}</td>
    <td>${esc(o['Nama Pemesan'])}<br><a href="https://wa.me/${esc(o['WhatsApp'])}" target="_blank">${esc(o['WhatsApp'])}</a><br><span class="sm">${esc(o['Alamat'])}</span></td>
    <td>${rp(o['Total (Rp)'])}</td><td><select onchange="ubah('ubah_status_pesanan',{id:'${esc(o['ID Pesanan'])}',status:this.value})">
    ${['Baru','Diproses','Selesai','Dibatalkan'].map(s => `<option ${s===o['Status']?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('') + '</table>';
}

load();
</script>
</body>
</html>
