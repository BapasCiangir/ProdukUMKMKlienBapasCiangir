<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar / Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-store text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-tight">Katalog Produk</h1>
                    <p class="text-xs text-slate-500">Official Web Store</p>
                </div>
            </div>

            <!-- Lock / Admin Auth Status -->
            <div class="flex items-center gap-3">
                <!-- Status Badge -->
                <span id="adminBadge" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded-full border border-amber-200">
                    <i class="fa-solid fa-user-shield"></i> Mode Admin
                </span>

                <!-- Tombol Tambah Produk (Khusus Admin) -->
                <button id="btnOpenAddModal" onclick="openProductModal()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Tambah Produk</span>
                </button>

                <!-- Tombol Login / Logout Admin -->
                <button id="btnLogin" onclick="openLoginModal()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all flex items-center gap-2">
                    <i class="fa-solid fa-lock"></i>
                    <span>Login Admin</span>
                </button>
                
                <button id="btnLogout" onclick="logoutAdmin()" class="hidden bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all flex items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Filter & Search Section -->
        <section class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
            <!-- Search Bar -->
            <div class="relative flex-1 max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Cari nama atau deskripsi produk..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm shadow-sm">
            </div>

            <!-- Category Filters -->
            <div id="categoryFilters" class="flex gap-2 overflow-x-auto pb-2 md:pb-0 scrollbar-none">
                <!-- Dynamic Filter Buttons -->
            </div>
        </section>

        <!-- Product Grid -->
        <section>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Items will be populated by JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-box-open text-2xl"></i>
                </div>
                <h3 class="font-semibold text-slate-800 text-base mb-1">Produk Tidak Ditemukan</h3>
                <p class="text-slate-500 text-sm">Coba gunakan kata kunci lain atau pilih kategori yang berbeda.</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500">
            &copy; 2026 Katalog Produk Website. All rights reserved.
        </div>
    </footer>

    <!-- MODAL 1: LOGIN ADMIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-gear text-xl"></i>
                </div>
                <h3 class="font-bold text-lg text-slate-900">Login Administrator</h3>
                <p class="text-xs text-slate-500">Masukkan password untuk mengelola produk</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Password Admin</label>
                    <input type="password" id="adminPasswordInput" required placeholder="Masukkan password..." class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p id="loginErrorMsg" class="text-red-500 text-xs mt-1.5 hidden"><i class="fa-solid fa-circle-exclamation"></i> Password salah! Coba lagi.</p>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition-all shadow-md">
                    Masuk Mode Admin
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL 2: TAMBAH / EDIT PRODUK (Khusus Admin) -->
    <div id="productModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 id="modalTitle" class="font-bold text-lg text-slate-900 mb-4">Tambah Produk Baru</h3>
            
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4">
                <input type="hidden" id="productId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Produk *</label>
                    <input type="text" id="prodName" required placeholder="Contoh: Sepatu Sneakers" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis / Kategori Produk *</label>
                    <input type="text" id="prodCategory" required placeholder="Contoh: Fashion, Elektronik, Aksesoris" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Harga (Rp) *</label>
                    <input type="number" id="prodPrice" required placeholder="Contoh: 150000" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">URL Foto Produk *</label>
                    <input type="url" id="prodImage" required placeholder="https://domain.com/gambar.jpg" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Link Pembelian Produk *</label>
                    <input type="url" id="prodLink" required placeholder="https://shopee.co.id/link-produk atau https://wa.me/..." class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Deskripsi Singkat (Opsional)</label>
                    <textarea id="prodDesc" rows="2" placeholder="Deskripsi produk..." class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeProductModal()" class="px-4 py-2 border border-slate-300 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm">Simpan Produk</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- KONFIGURASI ADMIN ---
        const ADMIN_PASSWORD_SECRET = "BapasCiangi2026"; // GANTI PASSWORD ADMIN DI SINI
        
        let isAdminLoggedIn = false;
        let selectedCategory = "Semua";

        // Sample initial data jika LocalStorage kosong
        const initialProducts = [
            {
                id: "1",
                name: "Kemeja Batik Premium",
                category: "Fashion",
                price: 185000,
                image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500&q=80",
                link: "https://tokopedia.com",
                desc: "Kemeja batik katun halus, nyaman dipakai sehari-hari."
            },
            {
                id: "2",
                name: "Wireless Earbuds TWS",
                category: "Elektronik",
                price: 250000,
                image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500&q=80",
                link: "https://shopee.co.id",
                desc: "Audio jernih, koneksi bluetooth 5.3, tahan baterai hingga 24 jam."
            },
            {
                id: "3",
                name: "Jam Tangan Casual Minimalis",
                category: "Aksesoris",
                price: 320000,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80",
                link: "https://wa.me/628123456789",
                desc: "Tali kulit sintetis berkualitas, tahan cipratan air."
            }
        ];

        // Load database dari LocalStorage
        function getStoredProducts() {
            const stored = localStorage.getItem('catalog_products');
            if (!stored) {
                localStorage.setItem('catalog_products', JSON.stringify(initialProducts));
                return initialProducts;
            }
            return JSON.parse(stored);
        }

        function saveProductsToStorage(products) {
            localStorage.setItem('catalog_products', JSON.stringify(products));
        }

        // Format angka ke Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        // --- SISTEM AUTHENTICATION ADMIN ---
        function checkAdminSession() {
            const session = sessionStorage.getItem('admin_session');
            if (session === 'true') {
                isAdminLoggedIn = true;
            } else {
                isAdminLoggedIn = false;
            }
            updateAdminUI();
        }

        function updateAdminUI() {
            const btnLogin = document.getElementById('btnLogin');
            const btnLogout = document.getElementById('btnLogout');
            const btnOpenAddModal = document.getElementById('btnOpenAddModal');
            const adminBadge = document.getElementById('adminBadge');

            if (isAdminLoggedIn) {
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                btnOpenAddModal.classList.remove('hidden');
                adminBadge.classList.remove('hidden');
            } else {
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                btnOpenAddModal.classList.add('hidden');
                adminBadge.classList.add('hidden');
            }
            renderProducts();
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('loginErrorMsg').classList.add('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === ADMIN_PASSWORD_SECRET) {
                sessionStorage.setItem('admin_session', 'true');
                isAdminLoggedIn = true;
                closeLoginModal();
                updateAdminUI();
            } else {
                document.getElementById('loginErrorMsg').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('admin_session');
            isAdminLoggedIn = false;
            updateAdminUI();
        }

        // --- RENDER PRODUK & FILTER ---
        function renderCategories() {
            const products = getStoredProducts();
            const categories = ['Semua', ...new Set(products.map(p => p.category))];
            const filterContainer = document.getElementById('categoryFilters');
            
            filterContainer.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    selectedCategory === cat 
                    ? 'bg-indigo-600 text-white shadow-sm' 
                    : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                }">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const products = getStoredProducts();

            const filtered = products.filter(p => {
                const matchesCategory = selectedCategory === 'Semua' || p.category === selectedCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery) || (p.desc && p.desc.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSearch;
            });

            displayProducts(filtered);
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');

            if (products.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col h-full group">
                    <div class="relative aspect-square overflow-hidden bg-slate-100">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://via.placeholder.com/300?text=Gambar+Error'">
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-slate-700 text-[11px] font-bold px-2.5 py-1 rounded-md shadow-sm border border-slate-200">
                            ${p.category}
                        </span>

                        <!-- Tombol Aksi Admin (Edit & Hapus) -->
                        ${isAdminLoggedIn ? `
                            <div class="absolute top-3 right-3 flex gap-1.5">
                                <button onclick="editProduct('${p.id}')" class="w-8 h-8 bg-amber-500 hover:bg-amber-600 text-white rounded-lg flex items-center justify-center shadow-md transition-all" title="Edit Produk">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteProduct('${p.id}')" class="w-8 h-8 bg-red-600 hover:bg-red-700 text-white rounded-lg flex items-center justify-center shadow-md transition-all" title="Hapus Produk">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-slate-900 text-base mb-1 line-clamp-1">${p.name}</h3>
                            <p class="text-xs text-slate-500 mb-3 line-clamp-2">${p.desc || 'Tidak ada deskripsi.'}</p>
                        </div>
                        <div>
                            <div class="text-lg font-bold text-indigo-600 mb-3">
                                ${formatRupiah(p.price)}
                            </div>
                            <!-- Link Beli Aktif -->
                            <a href="${p.link}" target="_blank" rel="noopener noreferrer" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium text-xs py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors">
                                <span>Beli Sekarang</span>
                                <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- TAMBAH / EDIT / HAPUS PRODUK ---
        function openProductModal(isEdit = false) {
            document.getElementById('modalTitle').innerText = isEdit ? "Edit Produk" : "Tambah Produk Baru";
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
        }

        function saveProduct(e) {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const id = document.getElementById('productId').value;
            const name = document.getElementById('prodName').value;
            const category = document.getElementById('prodCategory').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const image = document.getElementById('prodImage').value;
            const link = document.getElementById('prodLink').value;
            const desc = document.getElementById('prodDesc').value;

            let products = getStoredProducts();

            if (id) {
                // Edit
                products = products.map(p => p.id === id ? { id, name, category, price, image, link, desc } : p);
            } else {
                // Tambah
                const newProduct = {
                    id: Date.now().toString(),
                    name,
                    category,
                    price,
                    image,
                    link,
                    desc
                };
                products.push(newProduct);
            }

            saveProductsToStorage(products);
            closeProductModal();
            renderCategories();
            filterProducts();
        }

        function editProduct(id) {
            const products = getStoredProducts();
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('productId').value = product.id;
            document.getElementById('prodName').value = product.name;
            document.getElementById('prodCategory').value = product.category;
            document.getElementById('prodPrice').value = product.price;
            document.getElementById('prodImage').value = product.image;
            document.getElementById('prodLink').value = product.link;
            document.getElementById('prodDesc').value = product.desc || '';

            openProductModal(true);
        }

        function deleteProduct(id) {
            if (!isAdminLoggedIn) return;
            if (confirm("Apakah Anda yakin ingin menghapus produk ini?")) {
                let products = getStoredProducts();
                products = products.filter(p => p.id !== id);
                saveProductsToStorage(products);
                renderCategories();
                filterProducts();
            }
        }

        // Inisialisasi Pertama
        window.addEventListener('DOMContentLoaded', () => {
            checkAdminSession();
            renderCategories();
            filterProducts();
        });
    </script>
</body>
</html>
